; ===========================================================================
;  TigerSpool RFID - Waveshare ESP32-S3-Touch-LCD-2 (240x320) + PN532 (HSU)
;
;  Reads a TigerTag NFC chip and writes the filament into a printer slot.
;  Printers are imported from the user's TigerTag account; nothing is typed
;  on the device. See ../docs/ARCHITECTURE.md.
; ===========================================================================
[env:tigerspool]
platform      = espressif32@^6.9.0
board         = esp32-s3-devkitc-1        ; ESP32-S3R8, 16 MB flash / 8 MB PSRAM
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; --- Flash and memory ------------------------------------------------------
; qio_opi selects the octal-PSRAM memory layout this board needs.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode  = qio
board_build.partitions  = partitions.csv   ; two OTA slots - see that file
board_upload.flash_size = 16MB

build_flags =
    ; Native USB-CDC carries the serial console, which is what frees GPIO43/44
    ; for the PN532. Dropping these two reclaims those pins and breaks the
    ; reader - see ../docs/WIRING.md.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLGFX_USE_V1
    -DLV_CONF_INCLUDE_SIMPLE                ; use include/lv_conf.h
    -DCORE_DEBUG_LEVEL=0                   ; the core's own [E]/[W] noise off
    ; The WebSockets library opens its TCP connection with a BLOCKING connect,
    ; from inside the loop that also drives the UI. Its default is 5000 ms, and
    ; measured on the bench that is exactly what an unreachable printer costs:
    ; 5006 ms in backend->loop(), one main-loop pass in five seconds, and a
    ; spinner that stands still while the device claims to be connecting.
    ; A printer on the same LAN answers a SYN in tens of milliseconds, so this
    ; only shortens the wait for a printer that is not going to answer at all.
    -DWEBSOCKETS_TCP_TIMEOUT=1200
    -I include

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0            ; panel + touch driver
    lvgl/lvgl @ ^8.3.11                    ; UI toolkit, same major as TigerScale
    links2004/WebSockets @ ^2.6.1          ; Creality, Snapmaker transports
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ ^2.8          ; Bambu Lab MQTT
